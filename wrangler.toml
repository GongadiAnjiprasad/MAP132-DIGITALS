name = "map132-digitals"
main = "worker/index.ts"
compatibility_date = "2026-10-31"
keep_vars = true

[[kv_namespaces]]
binding = "MAP132_KV"
id = "132f9ac025434a89a7d73a83328e20bf"

[ai]
binding = "AI"

[triggers]
crons = ["35 18 * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*"]

# Existing dashboard configuration:
# KV namespace binding: MAP132_KV
# R2 bucket binding: MAP132_MEDIA
# Worker secrets: ADMIN_PASSWORD and FREESOUND_API_KEY
# Workers AI is a native binding; no API key is placed in frontend code.
