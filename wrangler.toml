name = "map132-digitals"
main = "worker/index.ts"
compatibility_date = "2026-10-31"
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*"]


# Configure these bindings in the Cloudflare Worker dashboard before deployment:
# KV namespace binding: MAP132_KV
# R2 bucket binding: MAP132_MEDIA
# Worker secret required for live audio catalogue search: FREESOUND_API_KEY
# Add it with: npx wrangler secret put FREESOUND_API_KEY
# Keep the key server-side; never place it in frontend code.
