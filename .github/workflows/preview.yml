name: MAP132 DIGITALS Preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map132-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Generate optimized transparent brand logo
        run: npx --yes sharp-cli@6.1.0 -i public/resources/Logo.png -o public/resources/Logo.webp -f webp -q 90 --alphaQuality 100 resize 1200
      - name: Verify optimized brand logo
        run: test -s public/resources/Logo.webp
      - name: Run unit tests
        run: npm test
      - name: Install mobile browser
        run: npx playwright install --with-deps chromium
      - name: Run mobile end-to-end tests
        run: npm run test:e2e
      - name: Build preview website
        run: npm run build
      - name: Validate isolated preview Worker
        run: npx --yes wrangler@4.160.1 deploy --dry-run --config wrangler.preview.toml
      - name: Deploy isolated preview Worker
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.160.1"
          command: deploy --config wrangler.preview.toml
