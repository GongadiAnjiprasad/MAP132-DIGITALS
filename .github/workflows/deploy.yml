name: Build and deploy MAP132 DIGITALS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate optimized transparent brand logo
        run: npx --yes sharp-cli@6.1.0 -i public/resources/Logo.png -o public/resources/Logo.webp -f webp -q 90 --alphaQuality 100 resize 1200
      - name: Verify optimized brand logo
        run: test -s public/resources/Logo.webp && du -h public/resources/Logo.png public/resources/Logo.webp
      - name: Test swipe navigation
        run: set -o pipefail; npm test 2>&1 | tee test-output.log
      - name: Upload unit test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-output-${{ github.run_id }}
          path: test-output.log
          if-no-files-found: ignore
      - name: Install mobile browser
        run: npx playwright install chromium
      - name: Test mobile swipe interactions
        run: npm run test:e2e
      - name: Build website
        run: npm run build
      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run
      - name: Deploy isolated preview Worker
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.160.1"
          command: deploy --config wrangler.preview.toml
      - name: Deploy Worker and static website
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.160.1"
          command: deploy
          workingDirectory: .
