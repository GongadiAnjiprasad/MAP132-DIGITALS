name: Build and deploy MAP132 DIGITALS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/light-theme-premium-polish-2026-11-05]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test swipe navigation
        run: npm test
      - name: Install mobile browser
        run: npx playwright install chromium
      - name: Test mobile swipe interactions
        run: npm run test:e2e
      - name: Build website
        run: npm run build
      - name: Deploy Worker and static website
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: .
