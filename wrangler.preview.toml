name = "map132-digitals-preview"
main = "worker/preview.ts"
compatibility_date = "2026-10-31"
workers_dev = true

# Intentionally no production KV, R2, or cron bindings.
# Movie OST search runs locally in this preview and needs a preview-only
# YOUTUBE_API_KEY secret; never copy production storage bindings into preview.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*"]

# Use a service binding for read-only production API calls. This avoids
# unsupported same-zone workers.dev-to-workers.dev fetches (Cloudflare 1042).
[[services]]
binding = "PRODUCTION_API"
service = "map132-digitals"
